name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        run: |
          name="grassfield-notes-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir "$name"
          cp target/release/grassfield-notes README.md LICENSE CHANGELOG.md packaging/grassfield-notes.desktop "$name/"
          target/release/grassfield-notes --write-icon "$name/grassfield-notes.png"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: grassfield-notes-*.tar.gz

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          name="grassfield-notes-${GITHUB_REF_NAME}-windows-x86_64"
          mkdir "$name"
          cp target/release/grassfield-notes.exe README.md LICENSE CHANGELOG.md "$name/"
          7z a "$name.zip" "$name" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: grassfield-notes-*.zip

  macos:
    name: macOS (universal .app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build for Apple Silicon and Intel
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create -output grassfield-notes \
            target/aarch64-apple-darwin/release/grassfield-notes \
            target/x86_64-apple-darwin/release/grassfield-notes
      - name: Make the app bundle
        run: |
          app="Grassfield Notes.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp grassfield-notes "$app/Contents/MacOS/grassfield-notes"
          ./grassfield-notes --write-icon icon.png
          mkdir AppIcon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s icon.png --out AppIcon.iconset/icon_${s}x${s}.png > /dev/null
            sips -z $((s*2)) $((s*2)) icon.png --out AppIcon.iconset/icon_${s}x${s}@2x.png > /dev/null
          done
          iconutil -c icns AppIcon.iconset -o "$app/Contents/Resources/AppIcon.icns"
          version="${GITHUB_REF_NAME#v}"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Grassfield Notes</string>
            <key>CFBundleDisplayName</key><string>Grassfield Notes</string>
            <key>CFBundleIdentifier</key><string>app.grassfield.notes</string>
            <key>CFBundleExecutable</key><string>grassfield-notes</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          # ad-hoc signature so Apple Silicon Macs accept the binary (not notarised)
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" "grassfield-notes-${GITHUB_REF_NAME}-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: grassfield-notes-*.zip

  release:
    name: Draft release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            grassfield-notes-*.tar.gz
            grassfield-notes-*.zip
